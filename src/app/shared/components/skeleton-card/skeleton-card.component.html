<section class="skeleton-board" aria-label="Loading kanban board">
  @for (column of columns(); track column.title) {
    <div class="skeleton-column">
      <div class="column-header">
        <div class="skeleton-line skeleton-column-title"></div>
        <div class="skeleton-column-badge"></div>
      </div>

      <div class="column-cards">
        @for (item of column.items; track item) {
          <article class="skeleton-card" aria-hidden="true">
            <div class="card-header">
              <div class="skeleton-line skeleton-priority"></div>
              <div class="skeleton-menu"></div>
            </div>

            <div class="card-body">
              <div class="skeleton-line skeleton-title"></div>
              <div class="skeleton-description">
                <div class="skeleton-line"></div>
                <div class="skeleton-line"></div>
              </div>

              <div class="card-metadata">
                <div class="meta-row">
                  <div class="skeleton-meta-icon"></div>
                  <div class="skeleton-line skeleton-meta-text"></div>
                </div>
                <div class="meta-row">
                  <div class="skeleton-line skeleton-tag"></div>
                </div>
              </div>
            </div>

            <hr class="card-divider" />

            <div class="card-footer">
              <div class="assignee-info">
                <div class="skeleton-avatar"></div>
                <div class="skeleton-line skeleton-assignee"></div>
              </div>
            </div>
          </article>
        }
      </div>
    </div>
  }
</section>
