<h2 mat-dialog-title>{{ data.title || 'Confirm Action' | translate }}</h2>

<mat-dialog-content>
  <p>{{ data.message || 'Are you sure you want to proceed.' | translate }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()">
    {{ data.cancelText || 'Cancel' | translate }}
  </button>
  <button mat-flat-button [color]="data.confirmColor || 'warn'" type="button" (click)="onConfirm()">
    {{ data.confirmText || 'Delete' | translate }}
  </button>
</mat-dialog-actions>
