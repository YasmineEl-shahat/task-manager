<div class="filters-container">
  <!-- Search input -->
  <mat-form-field appearance="outline" class="search-field" subscriptSizing="dynamic">
    <mat-label>Search tasks</mat-label>
    <mat-icon matPrefix>search</mat-icon>
    <input
      matInput
      type="text"
      [value]="filters().search"
      (input)="onSearchInput($event)"
      placeholder="Search by title or description…"
      aria-label="Search tasks"
    />
    @if (filters().search) {
      <button
        matSuffix
        mat-icon-button
        type="button"
        aria-label="Clear search"
        (click)="clearSearch()"
      >
        <mat-icon>clear</mat-icon>
      </button>
    }
  </mat-form-field>

  <div class="dropdowns-row">
    <!-- Status filter -->
    <mat-form-field appearance="outline" class="filter-field" subscriptSizing="dynamic">
      <mat-label>Status</mat-label>
      <mat-select
        [value]="filters().status"
        (selectionChange)="onStatusChange($event.value)"
        aria-label="Filter by status"
      >
        <mat-option [value]="TaskFilterStatus.ALL">All Statuses</mat-option>
        <mat-option [value]="TaskFilterStatus.TODO">To Do</mat-option>
        <mat-option [value]="TaskFilterStatus.IN_PROGRESS">In Progress</mat-option>
        <mat-option [value]="TaskFilterStatus.DONE">Done</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Priority filter -->
    <mat-form-field appearance="outline" class="filter-field" subscriptSizing="dynamic">
      <mat-label>Priority</mat-label>
      <mat-select
        [value]="filters().priority"
        (selectionChange)="onPriorityChange($event.value)"
        aria-label="Filter by priority"
      >
        <mat-option [value]="TaskFilterPriority.ALL">All Priorities</mat-option>
        <mat-option [value]="TaskFilterPriority.HIGH">High</mat-option>
        <mat-option [value]="TaskFilterPriority.MEDIUM">Medium</mat-option>
        <mat-option [value]="TaskFilterPriority.LOW">Low</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Reset button -->
    @if (isFiltered()) {
      <button
        mat-stroked-button
        color="warn"
        type="button"
        class="reset-btn"
        (click)="resetFilters.emit()"
        aria-label="Reset all filters"
      >
        <mat-icon>filter_alt_off</mat-icon>
        Reset
      </button>
    }
  </div>
</div>
