<article class="task-card" [class.overdue]="isOverdue()">
  <div class="card-header">
    <div class="priority-wrapper">
      <span
        class="priority-badge"
        [class]="'priority-' + task().priority"
        [class.overdue-priority]="isOverdue()"
      >
        {{ priorityLabel() }}
      </span>
    </div>

    <button
      mat-icon-button
      type="button"
      class="more-menu-btn"
      [matMenuTriggerFor]="taskMenu"
      [attr.aria-label]="'Task options for ' + task().title"
    >
      <mat-icon class="more-icon">more_vert</mat-icon>
    </button>
  </div>

  <div class="card-body">
    <h3 class="task-heading">
      <button type="button" class="task-title-button" (click)="onCardClick()">
        <span class="task-title">{{ task().title }}</span>
      </button>
    </h3>

    @if (task().description) {
      <p class="task-description">{{ task().description }}</p>
    }

    <div class="card-metadata">
      @if (dueStatusInfo(); as due) {
        <div class="meta-row due-row" [class.overdue-meta]="due.isOverdue">
          <mat-icon class="meta-icon">{{ due.icon }}</mat-icon>
          <span>{{ due.text }}</span>
        </div>
      }

      @if (tagText(); as tags) {
        <div class="meta-row tag-row">
          <span>{{ tags }}</span>
        </div>
      }
    </div>
  </div>

  <hr class="card-divider" />

  <div class="card-footer">
    <div class="assignee-info">
      <span class="avatar-circle" [title]="task().assignee.name">
        {{ assigneeInitials() }}
      </span>
      <span class="assignee-name">{{ assigneeHandle() }}</span>
    </div>
  </div>

  <mat-menu #taskMenu="matMenu" xPosition="before">
    <button mat-menu-item (click)="onEdit($event)" [attr.aria-label]="'Edit task: ' + task().title">
      <mat-icon>edit</mat-icon>
      <span>Edit</span>
    </button>
    <button
      mat-menu-item
      (click)="onDelete($event)"
      [attr.aria-label]="'Delete task: ' + task().title"
    >
      <mat-icon color="warn">delete</mat-icon>
      <span>Delete</span>
    </button>
    @for (option of statusOptions; track option.value) {
      <button
        mat-menu-item
        [disabled]="task().status === option.value"
        (click)="onStatusChange(option.value)"
      >
        <mat-icon>arrow_forward</mat-icon>
        <span>Move to {{ option.label }}</span>
      </button>
    }
    <button mat-menu-item [disabled]="position() === 0" (click)="reorder.emit('up')">
      <mat-icon>arrow_upward</mat-icon>
      <span>Move earlier</span>
    </button>
    <button
      mat-menu-item
      [disabled]="position() === taskCount() - 1"
      (click)="reorder.emit('down')"
    >
      <mat-icon>arrow_downward</mat-icon>
      <span>Move later</span>
    </button>
  </mat-menu>
</article>
