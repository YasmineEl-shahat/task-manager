<div class="kanban-column">
  <div class="column-header">
    <h3 class="column-title">{{ title() }}</h3>
    <span class="column-badge">{{ count() }}</span>
  </div>

  <div
    class="column-cards"
    cdkDropList
    [cdkDropListData]="tasks()"
    (cdkDropListDropped)="onDrop($event)"
  >
    @for (task of tasks(); track task.id; let index = $index) {
      <div class="task-drag-item" cdkDrag [cdkDragData]="task">
        <button
          type="button"
          class="drag-handle"
          cdkDragHandle
          [attr.aria-label]="'Reorder task ' + task.title"
          title="Drag to reorder or change status"
        >
          <mat-icon>drag_indicator</mat-icon>
        </button>
        <app-task-card
          [task]="task"
          [position]="index"
          [taskCount]="count()"
          (selectTask)="selectTask.emit($event)"
          (editTask)="editTask.emit($event)"
          (deleteTask)="deleteTask.emit($event)"
          (statusChange)="statusChange.emit({ taskId: task.id, status: $event })"
          (reorder)="moveTask(task.id, $event)"
        />
      </div>
    } @empty {
      <div class="column-empty">
        <mat-icon class="empty-icon">{{ emptyIcon() }}</mat-icon>
        <span>{{ emptyMessage() }}</span>
      </div>
    }
  </div>
</div>
